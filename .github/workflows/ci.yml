# Проверки на каждый push и pull request: CLI, агенты и настольное приложение.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      # Пакет Wails проверяется отдельно с собранным интерфейсом и GTK/WebKit.
      - run: go vet $(go list -e ./... | grep -v /app)
      - run: go test $(go list -e ./... | grep -v /app)
      - run: bash tools/redact-check.sh

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Установить GTK и WebKitGTK для тестов Go
        run: sudo apt-get update -q && sudo apt-get install -y -q libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Собрать интерфейс
        working-directory: app/frontend
        run: npm ci && npm run build
      - name: Проверить пакет приложения
        run: |
          go vet -tags webkit2_41 ./app
          go test -tags webkit2_41 ./app
      - name: Проверить сценарии интерфейса
        working-directory: app/frontend
        run: |
          npx playwright install --with-deps --only-shell chromium
          npm test
