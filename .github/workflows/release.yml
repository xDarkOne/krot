# Релиз: тег vX.Y.Z → сборка приложения и CLI под все платформы → GitHub Release с SHA256SUMS.
#   git tag v0.2.0 && git push origin v0.2.0
# Linux собирается на Ubuntu 22.04 (glibc 2.35): так бинарник запускается и на Debian 12,
# и на свежих дистрибутивах. macOS — только на macOS (Cocoa, cgo). Windows — кросс-сборкой
# Wails с Linux (WebView2 без cgo).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "версия для пробной сборки (без публикации релиза), например 0.0.0-test"
        required: true
        default: "0.0.0-test"

permissions:
  contents: write

env:
  WAILS_VERSION: v2.16.0
  NODE_VERSION: "22"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.version }}"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"

  cli:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: go vet $(go list -e ./... | grep -v /app) && go test $(go list -e ./... | grep -v /app)
      - name: CLI под все платформы
        env: {V: "${{ needs.version.outputs.v }}"}
        run: |
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            name=$os; [ "$os" = darwin ] && name=macos
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$V -X main.updateRepo=$GITHUB_REPOSITORY" \
              -o "dist/krot-cli-$V-$name-$arch$ext" ./cmd/krot
          done
      - uses: actions/upload-artifact@v4
        with: {name: cli, path: dist/*}

  app-linux:
    needs: version
    strategy:
      matrix:
        include:
          - {runner: ubuntu-22.04, arch: amd64}
          - {runner: ubuntu-22.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@v4
        with: {node-version: "${{ env.NODE_VERSION }}"}
      - run: sudo apt-get update -q && sudo apt-get install -y -q libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
      - name: версия в метаданных
        run: jq --arg v "${{ needs.version.outputs.v }}" '.info.productVersion=$v' app/wails.json > w && mv w app/wails.json
      - name: сборка
        working-directory: app
        run: wails build -tags webkit2_41 -platform linux/${{ matrix.arch }} -trimpath -ldflags "-X main.version=${{ needs.version.outputs.v }} -X main.updateRepo=${{ github.repository }}" -o krot-app
      - name: архив
        env: {V: "${{ needs.version.outputs.v }}"}
        run: |
          d=krot-app-$V-linux-${{ matrix.arch }}
          mkdir -p dist/$d
          cp app/build/bin/krot-app dist/$d/
          cp packaging/icon/krot.svg dist/$d/krot.svg
          cp packaging/linux/krot.desktop packaging/linux/install.sh packaging/linux/README.txt dist/$d/
          cp LICENSE dist/$d/
          tar -C dist -czf dist/$d.tar.gz $d && rm -rf dist/$d
      - uses: actions/upload-artifact@v4
        with: {name: "app-linux-${{ matrix.arch }}", path: dist/*.tar.gz}

  app-windows:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@v4
        with: {node-version: "${{ env.NODE_VERSION }}"}
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
      - run: jq --arg v "${{ needs.version.outputs.v }}" '.info.productVersion=$v' app/wails.json > w && mv w app/wails.json
      - name: сборка
        working-directory: app
        run: wails build -platform windows/${{ matrix.arch }} -trimpath -ldflags "-X main.version=${{ needs.version.outputs.v }} -X main.updateRepo=${{ github.repository }}" -o krot-app.exe
      - env: {V: "${{ needs.version.outputs.v }}"}
        run: mkdir -p dist && cp app/build/bin/krot-app.exe "dist/krot-app-$V-windows-${{ matrix.arch }}.exe"
      - uses: actions/upload-artifact@v4
        with: {name: "app-windows-${{ matrix.arch }}", path: dist/*}

  app-macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@v4
        with: {node-version: "${{ env.NODE_VERSION }}"}
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
      - run: jq --arg v "${{ needs.version.outputs.v }}" '.info.productVersion=$v' app/wails.json > w && mv w app/wails.json
      - name: сборка (Intel + Apple Silicon в одном .app)
        working-directory: app
        run: wails build -platform darwin/universal -trimpath -ldflags "-X main.version=${{ needs.version.outputs.v }} -X main.updateRepo=${{ github.repository }}"
      - name: архив
        env: {V: "${{ needs.version.outputs.v }}"}
        run: |
          mkdir -p dist
          app=$(ls -d app/build/bin/*.app | head -1)
          ditto -c -k --keepParent "$app" "dist/krot-app-$V-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with: {name: app-macos, path: dist/*}

  release:
    needs: [version, cli, app-linux, app-windows, app-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: dist, merge-multiple: true}
      - name: контрольные суммы
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with: {name: release-preview, path: dist/*}
      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.v }}
        run: |
          notes=$RUNNER_TEMP/notes.md
          sed "s|REPO|$GITHUB_REPOSITORY|g" packaging/release-notes.md > "$notes"
          gh release create "$GITHUB_REF_NAME" dist/* --title "krot $V" --notes-file "$notes" --verify-tag
