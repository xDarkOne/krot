# Пример inventory: готовый защищённый каскад (Россия → заграница, topology: cascade).
# Скопируйте в inventory.yaml и подставьте свои IP, домен и путь к SSH-ключам.
# Секреты (ключи AWG, VLESS, пароли, токены) здесь не хранятся — пульт создаёт их сам
# в зашифрованном secrets.age (krot secrets init --key).
#
# Особенности этого профиля (best practices):
#   - XHTTP работает на стандартном TCP/443 (через nginx SNI stream, порт 4443 не торчит наружу);
#   - каскад awg0 и клиентский вход awg2 используют AmneziaWG 3.1 на случайных высоких UDP-портах;
#   - Hysteria2 (sing-box 1.14.6) на UDP/443, MTProxyL (v1.8.7 / telemt 3.5.17) на TCP/443 + WEB Proxy;
#   - Cloudflare DNS создаётся с TTL 60с для быстрого переезда при блокировке IP;
#   - включены conntrack 65536, увеличенные UDP-буферы, panic=10, бэкапы + vpnkit-restore.sh и relocate + vpnkit-dns.
#
# Список всех модулей и умолчаний: krot catalog cascade
version: 1
topology: cascade
domain: example.org

nodes:
  ru:                                    # вход (РФ): к нему подключаются все клиенты
    host: 203.0.113.10
    role: entry
    ssh: {user: root, port: 22, auth: key, key: ~/.krot/keys/ru_ed25519}
    modules:
      nginx-tls:
        names: [es.example.org, ru.example.org, web.example.org]
        tunnel_name: es.example.org      # VLESS XHTTP (:443 через SNI) + Hysteria2 (UDP/443)
        # xhttp_port: 443                # по умолчанию 443 (можно сменить на 4443 при необходимости)
      subscriptions: {sub_name: ru.example.org}
      mtproxy: {mask_name: ru.example.org, web_name: web.example.org}
      # Рекомендуемые дополнения (раскомментируйте нужное):
      # vpn-bot: {enabled: true}         # Telegram-бот управления (токен задаётся через krot alerts set)
      # vpn-panel: {enabled: true}       # веб-панель статистики и клиентов
      # hysteria2: {per_client: true}    # учёт трафика Hysteria2 по каждому клиенту
      # aivpn: {enabled: true}           # дополнительный транспорт AIVPN
      # csqtt: {enabled: true}           # дополнительный транспорт CSQTT
      # exit-socks: {enabled: true}
      # Устаревшие/опциональные профили (обычно не требуются для новой установки):
      # client-awg-legacy: {enabled: true}
      # client-wireguard: {enabled: true}
      # vk-turn-proxy: {enabled: true}

  eu:                                    # выход (заграница): выпускает трафик в интернет
    host: 198.51.100.20
    role: exit
    ssh: {user: root, port: 22, auth: key, key: ~/.krot/keys/eu_ed25519}
    # если выход недоступен напрямую с ПК — ходить к нему через вход:
    # ssh: {user: root, port: 22, auth: key, key: ~/.krot/keys/eu_ed25519,
    #       jump: {host: 203.0.113.10, user: root, key: ~/.krot/keys/ru_ed25519}}
    modules:
      cascade-awg0:
        # port: 43819                    # по умолчанию генерируется случайный UDP-порт 20000–60000 (не 51820)
        # exit_ipv6: "2001:db8::20"      # глобальный IPv6 выхода для резервного пути awg0 (опционально)
        reality_server_name: ""          # имя доступного с exit внешнего TLS 1.3 / HTTP/2 сайта для TCP-резерва sbtun
        reality_port: 24443              # TCP-порт резерва (отдельно от веб-витрины на 443)
      nginx-tls: {names: [en.example.org]}   # витрина выхода
